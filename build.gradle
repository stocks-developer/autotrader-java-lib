/*
* build.gradle - project at-api
*/
buildscript {
	repositories {
		mavenCentral()
		mavenLocal()
	}

	dependencies {
		classpath 'com.dakshata:gradle-build:1.0.0'
	}
}

apply plugin: 'com.dakshata.gradle.build.release'

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
}

dependencies {

	// Use following version during github repo publish
	//api 'com.dakshata:public-library:3.0.0'

	api 'com.dakshata:public-library:1.0.0'
	api 'com.konghq:unirest-java:3.13.10'
	api 'com.konghq:unirest-objectmapper-jackson:3.4.01'

	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'	
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.6.2'
}

//create a single Jar with all dependencies
task fatJar(type: Jar) {
	setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)	
	manifest {
		attributes 'Implementation-Title': 'AutoTrader Web Java API',
		'Implementation-Version': archiveVersion
	}
	archiveBaseName = project.name + '-all'
	// Our dependencies' build stamps are stripped here. Every com.dakshata jar carries
	// dakshata/build.properties at the same path, and DuplicatesStrategy.INCLUDE would
	// write several of them into this archive under one name -- so a reader gets
	// whichever came first, which is not this artifact's. at-api is published to
	// customers, so it should carry its own identity and nothing about our internals.
	// `with jar` below still brings in at-api's own stamp.
	from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
		exclude 'dakshata/build.properties'
	}
	with jar
}

test {
    useJUnitPlatform {
        excludeTags 'skip'
    }
    // All non-skipped tests may be excluded. Skip the task entirely when
    // invoked transitively (build/check) so Gradle's "no test executed" check
    // doesn't fire. Run manually with `./gradlew test --tests "..."`.
    onlyIf {
        gradle.startParameter.taskNames.any { it == 'test' || it == ':test' || it.endsWith(':test') } ||
            !filter.includePatterns.isEmpty() ||
            !filter.commandLineIncludePatterns.isEmpty()
    }
}

// To publish to our maven repository hosted on github
// 1. Update the project version
// 2. Update the version of public-library project
// 3. gradle publishAllPublicationsToGithubRepository
// 4. Commit and push maven_repo project

//project.version = '3.0.0'

publishing {
    repositories {
        maven {
			name = "github"
            url = layout.projectDirectory.dir('../maven_repo')
        }
    }
}